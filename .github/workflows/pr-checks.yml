name: PR Checks

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Run Linter
      run: |
        cd apps/desktop
        npm run lint
        
    - name: Typecheck Main App
      run: |
        cd apps/desktop
        npm run typecheck
        
    - name: Run Unit Tests
      run: pnpm test
      
    - name: Build Main App
      run: |
        cd apps/desktop
        npm run build
